<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Универсальный веб-скрапер</title>
    <link rel="stylesheet" href="/css/output.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
      <h1 class="text-3xl font-bold mb-6">Универсальный веб-скрапер</h1>
      <div class="form-container mb-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div class="relative">
            <input class="w-full px-4 py-2 border rounded-lg pr-8" id="urlInput" type="url" placeholder="Введите URL сайта" required>
            <button class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" id="clearUrl" type="button">×</button>
          </div>
          <div class="flex gap-4 items-end">
            <label class="flex flex-col" for="linksLimit"><span class="text-xs text-gray-600 mb-1">Кол-во ссылок</span>
              <input class="w-32 px-4 py-2 border rounded-lg" id="linksLimit" type="number" placeholder="Ссылки" value="10" min="1" max="100">
            </label>
            <label class="flex flex-col" for="imagesLimit"><span class="text-xs text-gray-600 mb-1">Кол-во картинок</span>
              <input class="w-32 px-4 py-2 border rounded-lg" id="imagesLimit" type="number" placeholder="Картинки" value="10" min="1" max="50">
            </label>
            <label class="flex flex-col" for="headingsLimit"><span class="text-xs text-gray-600 mb-1">Кол-во заголовков</span>
              <input class="w-32 px-4 py-2 border rounded-lg" id="headingsLimit" type="number" placeholder="Заголовки" value="10" min="1" max="50">
            </label>
            <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg" id="resetInputs" type="button">Сброс</button>
          </div>
        </div>
        <div class="flex gap-4 items-center">
          <button class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg" onclick="startScraping()">Начать скрапинг</button>
          <button class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg" id="resetInputs" type="button">Сброс</button>
          <select class="px-4 py-2 border rounded-lg" id="dataType">
            <option value="all">Все данные</option>
            <option value="links">Только ссылки</option>
            <option value="images">Только картинки</option>
            <option value="headings">Только заголовки</option>
            <option value="metadata">Только метаданные</option>
          </select>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow-lg p-6" id="result"></div>
    </div>
    <script src="/js/main.js"></script>
  </body>
</html>
